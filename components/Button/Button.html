<!-- Primary Button -->
<button class="btn btn-primary">تسوقي الآن</button>

<!-- Secondary Button -->
<button class="btn btn-secondary">عرض التفاصيل</button>

<!-- Outline Button -->
<button class="btn btn-outline">إضافة للسلة</button>

<!-- Ghost Button -->
<button class="btn btn-ghost">اكتشفي روتينك</button>

<!-- Full Width Button -->
<button class="btn btn-primary btn-block">إتمام الطلب</button>

<!-- Loading Button -->
<button class="btn btn-primary is-loading">إتمام الطلب</button>

<!-- Disabled Button -->
<button class="btn btn-primary" disabled>غير متوفر حاليًا</button>

<!-- Button with Icon (SVG placeholder) -->
<button class="btn btn-outline">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

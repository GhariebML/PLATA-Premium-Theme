<!-- 
  COMPONENT: PRODUCT CARD
  ProductCard.html
-->

<article class="product-card">
  <!-- Image & Badges -->
  <div class="product-card-image-wrap">
    <!-- Badges -->
    <div class="product-badges">
      <span class="product-badge product-badge--bestseller">الأكثر مبيعًا</span>
      <!-- <span class="product-badge product-badge--new">جديد</span> -->
    </div>
    
    <!-- Wishlist Action -->
    <button class="product-wishlist-btn" aria-label="أضف للمفضلة">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
    </button>
    
    <!-- Image -->
    <a href="/product/serum">
      <img src="/assets/images/placeholders/product-1.jpg" alt="سيروم بلاتا للإشراق" class="product-card-image" loading="lazy">
    </a>
  </div>

  <!-- Content -->
  <div class="product-card-content">
    
    <!-- Rating -->
    <div class="product-rating">
      <div class="product-stars">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
      </div>
      <span class="product-rating-count">(45)</span>
    </div>

    <!-- Title & Desc -->
    <a href="/product/serum" class="product-title">سيروم PLATA للإشراق</a>
    <p class="product-subtitle">يجدد خلايا البشرة ويمنحها نضارة</p>
    
    <!-- Price -->
    <div class="product-price-wrap">
      <span class="product-price">145 ر.س</span>
      <!-- Example of sale price -->
      <!-- <span class="product-price--original">180 ر.س</span> -->
    </div>

    <!-- CTA -->
    <button class="btn btn-outline btn-block">أضف للسلة</button>
    
  </div>
</article>

<header class="site-header d-lg-none">
  <div class="container">
    <div class="header-inner">
      
      <!-- Right Side (Start): Menu Toggle & Search -->
      <div class="header-actions">
        <!-- Hamburger Menu -->
        <button class="header-action-btn mobile-menu-toggle" aria-label="القائمة">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <!-- Search -->
        <button class="header-action-btn" aria-label="بحث">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>

      <!-- Center: Logo -->
      <a href="/" class="header-logo">
        P L A T A
      </a>

      <!-- Left Side (End): Cart & Wishlist -->
      <div class="header-actions">
        <!-- Wishlist -->
        <a href="/account/wishlist" class="header-action-btn" aria-label="المفضلة">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </a>

        <!-- Cart -->
        <a href="/pages/cart/index.html" class="header-action-btn" aria-label="سلة المشتريات">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="header-badge">3</span>
        </a>
      </div>

    </div>
  </div>
</header>

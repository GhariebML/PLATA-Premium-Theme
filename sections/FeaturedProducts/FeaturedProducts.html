<section class="featured-products-section">
  <div class="container">
    
    <div class="section-header">
      <h2 class="section-title h2">منتجاتنا المميزة</h2>
      <a href="/shop" class="section-link">
        عرض الكل
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </div>

    <!-- Replace .products-grid with .products-grid--mobile-scroll if swipe is preferred on mobile -->
    <div class="products-grid products-grid--mobile-scroll">
      
      <!-- Product 1 (Include ProductCard HTML here via Liquid {% include 'product-card' %} -->
      <article class="product-card">
        <div class="product-card-image-wrap">
          <div class="product-badges">
            <span class="product-badge product-badge--bestseller">الأكثر مبيعًا</span>
          </div>
          <button class="product-wishlist-btn" aria-label="أضف للمفضلة">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </button>
          <img src="/assets/images/placeholders/product-1.jpg" alt="سيروم بلاتا" class="product-card-image" loading="lazy">
        </div>
        <div class="product-card-content">
          <div class="product-rating">
            <div class="product-stars" style="color:var(--color-star)">★★★★★</div>
            <span class="product-rating-count">(45)</span>
          </div>
          <a href="/product/1" class="product-title">سيروم PLATA للإشراق</a>
          <p class="product-subtitle">يجدد خلايا البشرة</p>
          <div class="product-price-wrap"><span class="product-price">145 ر.س</span></div>
          <button class="btn btn-outline btn-block">أضف للسلة</button>
        </div>
      </article>

      <!-- Product 2 -->
      <article class="product-card">
        <div class="product-card-image-wrap">
          <button class="product-wishlist-btn" aria-label="أضف للمفضلة">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </button>
          <img src="/assets/images/placeholders/product-2.jpg" alt="مرطب بلاتا" class="product-card-image" loading="lazy">
        </div>
        <div class="product-card-content">
          <div class="product-rating">
            <div class="product-stars" style="color:var(--color-star)">★★★★☆</div>
            <span class="product-rating-count">(28)</span>
          </div>
          <a href="/product/2" class="product-title">كريم الترطيب العميق</a>
          <p class="product-subtitle">ترطيب يدوم 48 ساعة</p>
          <div class="product-price-wrap"><span class="product-price">120 ر.س</span></div>
          <button class="btn btn-outline btn-block">أضف للسلة</button>
        </div>
      </article>

      <!-- Product 3 -->
      <article class="product-card">
        <div class="product-card-image-wrap">
          <div class="product-badges">
            <span class="product-badge product-badge--new">جديد</span>
          </div>
          <button class="product-wishlist-btn" aria-label="أضف للمفضلة">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
          </button>
          <img src="/assets/images/placeholders/product-3.jpg" alt="غسول بلاتا" class="product-card-image" loading="lazy">
        </div>
        <div class="product-card-content">
          <div class="product-rating">
            <div class="product-stars" style="color:var(--color-star)">★★★★★</div>
            <span class="product-rating-count">(12)</span>
          </div>
          <a href="/product/3" class="product-title">غسول الوجه الرغوي</a>
          <p class="product-subtitle">ينظف بعمق بلطف</p>
          <div class="product-price-wrap"><span class="product-price">85 ر.س</span></div>
          <button class="btn btn-outline btn-block">أضف للسلة</button>
        </div>
      </article>

    </div>
  </div>
</section>

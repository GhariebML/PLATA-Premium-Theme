<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>استبيان البشرة | بلاتا - PLATA</title>
  
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
  <link rel="stylesheet" href="../../assets/css/typography.css">
  <link rel="stylesheet" href="../../assets/css/utilities.css">
  <link rel="stylesheet" href="../../assets/css/animations.css">
  
  <link rel="stylesheet" href="../../components/Header/Header.css">
  <link rel="stylesheet" href="../../components/Button/Button.css">
  
  <link rel="stylesheet" href="quiz.css">
</head>
<body class="quiz-page">

  <!-- Simple Header for Quiz to reduce distraction -->
  <header class="site-header" style="position:relative; border-bottom:none; background:transparent;">
    <div class="container" style="display:flex; justify-content:center; padding:var(--space-4);">
      <a href="/" class="header-logo" style="font-size:24px;">P L A T A</a>
    </div>
  </header>

  <main class="quiz-main">
    <div class="quiz-container slide-up">
      
      <!-- Step View -->
      <div id="quizStep1" class="quiz-step">
        <div class="quiz-progress-wrap">
          <div class="quiz-progress-text">
            <span>كيف تصفين نوع بشرتك؟</span>
            <span>الخطوة 1 من 4</span>
          </div>
          <div class="quiz-progress-bar">
            <div class="quiz-progress-fill" style="width: 25%;"></div>
          </div>
        </div>

        <h1 class="quiz-question-title">كيف تشعرين ببشرتك بعد غسلها بساعة؟</h1>

        <div class="quiz-options">
          
          <label class="quiz-option">
            <input type="radio" name="skin_type" value="dry" class="d-none">
            <div class="quiz-option-radio"></div>
            <div class="quiz-option-content">
              <span class="quiz-option-title">جافة ومشدودة</span>
              <span class="quiz-option-desc">أشعر بحاجة ماسة لوضع مرطب.</span>
            </div>
          </label>

          <label class="quiz-option is-selected">
            <input type="radio" name="skin_type" value="oily" class="d-none" checked>
            <div class="quiz-option-radio"></div>
            <div class="quiz-option-content">
              <span class="quiz-option-title">دهنية ولامعة</span>
              <span class="quiz-option-desc">ألاحظ لمعان في الجبهة والأنف والذقن.</span>
            </div>
          </label>

          <label class="quiz-option">
            <input type="radio" name="skin_type" value="combination" class="d-none">
            <div class="quiz-option-radio"></div>
            <div class="quiz-option-content">
              <span class="quiz-option-title">مختلطة</span>
              <span class="quiz-option-desc">دهنية في منطقة T وجافة في الخدين.</span>
            </div>
          </label>

          <label class="quiz-option">
            <input type="radio" name="skin_type" value="normal" class="d-none">
            <div class="quiz-option-radio"></div>
            <div class="quiz-option-content">
              <span class="quiz-option-title">عادية ومتوازنة</span>
              <span class="quiz-option-desc">لا أشعر بشد ولا ألاحظ لمعان زائد.</span>
            </div>
          </label>

        </div>

        <div class="quiz-nav">
          <a href="/" class="btn btn-ghost">إلغاء</a>
          <button class="btn btn-primary" onclick="document.getElementById('quizStep1').classList.add('d-none'); document.getElementById('quizLoading').classList.add('is-active'); setTimeout(() => window.location.href='/pages/routines/index.html', 2000);">التالي</button>
        </div>
      </div>

      <!-- Loading Result State (Simulated) -->
      <div id="quizLoading" class="quiz-loading">
        <div class="spinner"></div>
        <h2 class="quiz-loading-title">نقوم بتحليل إجاباتك...</h2>
        <p class="text-muted">نبحث عن الروتين الأمثل لبشرتك</p>
      </div>

    </div>
  </main>

  <script>
    // Simple script to handle radio selection styling
    document.querySelectorAll('.quiz-option').forEach(option => {
      option.addEventListener('click', function() {
        document.querySelectorAll('.quiz-option').forEach(opt => opt.classList.remove('is-selected'));
        this.classList.add('is-selected');
        this.querySelector('input').checked = true;
      });
    });
  </script>
</body>
</html>
